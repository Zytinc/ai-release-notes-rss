name: Update AI release-note feeds

on:
  workflow_dispatch:
  schedule:
    # Run at minute 17 to avoid the busiest top-of-hour period.
    - cron: "17 */6 * * *"
    # Weekly activity commit keeps this public repository from becoming inactive.
    - cron: "43 3 * * 0"

permissions:
  contents: write

concurrency:
  group: ai-release-note-feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "beautifulsoup4==4.14.3" "requests==2.32.5"

      - name: Build feeds
        run: python scripts/generate_feeds.py

      - name: Commit feed updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json docs/feeds
          if git diff --cached --quiet; then
            echo "No feed changes detected."
          else
            git commit -m "chore: update release-note feeds"
            git push
          fi

      - name: Create weekly activity commit when no feed changed
        if: github.event.schedule == '43 3 * * 0'
        run: |
          if git diff --quiet HEAD; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > data/last-heartbeat.txt
            git add data/last-heartbeat.txt
            git commit -m "chore: keep scheduled feed updates active"
            git push
          fi
